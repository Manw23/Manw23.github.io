<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMES | Manw23's Hub</title>
    <link rel="icon" href="https://www.innersloth.com/wp-content/uploads/2021/06/among-us-favicon.png" type="image/png">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            font-family: 'Press Start 2P', cursive;
        }

        header {
            background: rgba(0, 0, 0, 0.95);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 8px solid #ff00ff;
        }

        h1 { font-size: 3.6em; text-shadow: 0 0 25px #ff00ff; margin: 0; }

        .user-area {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            font-size: 1.2em;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            max-width: 1700px;
            margin: 50px auto;
            padding: 0 30px;
        }

        .game-card {
            background: rgba(255,255,255,0.1);
            border: 5px solid #ff00ff;
            border-radius: 18px;
            overflow: hidden;
            transition: 0.4s;
        }

        .game-card:hover { transform: scale(1.08); box-shadow: 0 0 50px #00ffff; }

        .game-card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
        }

        .game-info { padding: 18px; text-align: center; }

        button {
            background: #ff00ff;
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 5px;
            font-family: inherit;
            cursor: pointer;
        }

        button:hover { background: #00ffff; color: black; }

        .reaction { font-size: 1.8em; cursor: pointer; margin: 0 10px; }
    </style>
</head>
<body>
    <header>
        <h1>GAMES</h1>
        <div class="user-area" onclick="toggleSidebar()">
            <span id="userIcon" style="font-size:32px;">🧑</span>
            <span id="usernameDisplay">Guest</span>
        </div>
    </header>

    <!-- SIDEBAR -->
    <div id="sidebar" style="position:fixed;top:0;right:-450px;width:430px;height:100vh;background:#1a0033;border-left:8px solid #ff00ff;transition:0.5s;padding:30px;overflow-y:auto;z-index:3000;">
        <span onclick="toggleSidebar()" style="float:right;font-size:40px;cursor:pointer;color:#ff00ff;">×</span>
        <h2>PROFILE</h2>
        
        <p><strong>Name:</strong> <span id="sidebarUsername">Guest</span></p>
        <input id="newUsername" placeholder="New Name" style="width:100%;padding:10px;margin:10px 0;">
        <button onclick="changeUsername()">CHANGE NAME</button>

        <h3>Choose Icon</h3>
        <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:15px;font-size:42px;">
            <span onclick="chooseIcon(this)">🧑</span><span onclick="chooseIcon(this)">👾</span>
            <span onclick="chooseIcon(this)">🚀</span><span onclick="chooseIcon(this)">🎮</span>
            <span onclick="chooseIcon(this)">🐱</span><span onclick="chooseIcon(this)">🔥</span>
            <span onclick="chooseIcon(this)">⚡</span><span onclick="chooseIcon(this)">🦍</span>
            <span onclick="chooseIcon(this)">🕹️</span><span onclick="chooseIcon(this)">🌌</span>
            <span onclick="chooseIcon(this)">💀</span><span onclick="chooseIcon(this)">👑</span>
            <span onclick="chooseIcon(this)">🦊</span><span onclick="chooseIcon(this)">🍄</span>
            <span onclick="chooseIcon(this)">🐉</span><span onclick="chooseIcon(this)">🌈</span>
            <span onclick="chooseIcon(this)">🧿</span><span onclick="chooseIcon(this)">🔥</span>
            <span onclick="chooseIcon(this)">🦾</span><span onclick="chooseIcon(this)">🎩</span>
            <span onclick="chooseIcon(this)">🦁</span><span onclick="chooseIcon(this)">🍕</span>
        </div>
    </div>

    <div class="game-grid">
        <div class="game-card">
            <img src="https://upload.wikimedia.org/wikipedia/en/9/9a/Among_Us_cover_art.jpg" alt="Among Us">
            <div class="game-info">
                <h3>AMONG US</h3>
                <div class="players">5,234 playing now</div>
                <button onclick="window.open('https://www.innersloth.com/games/among-us/', '_blank')">PLAY NOW</button>
                <span class="reaction" onclick="toggleLike(this)">❤️</span>
                <span class="reaction" onclick="toggleDislike(this)">👎</span>
                <button onclick="showCommentBox(1)">💬 COMMENT</button>
            </div>
        </div>

        <!-- Add more games the same way if you want -->

    </div>

    <!-- Comment Modal -->
    <div id="commentModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:1000;">
        <div style="background:#1a0033;margin:8% auto;padding:25px;width:80%;max-width:600px;border:5px solid #ff00ff;">
            <span onclick="closeCommentModal()" style="float:right;font-size:32px;cursor:pointer;color:#ff00ff;">×</span>
            <h2 id="modalTitle">Write Comment</h2>
            <textarea id="commentInput" placeholder="Write your comment here..." style="width:100%;height:140px;padding:12px;margin:15px 0;"></textarea>
            <button onclick="postComment()">POST COMMENT</button>
            <div id="commentHistory" style="margin-top:20px;text-align:left;"></div>
        </div>
    </div>

    <script>
        let currentUser = localStorage.getItem("username") || "Guest";
        let currentIcon = localStorage.getItem("userIcon") || "🧑";

        function updateUserDisplay() {
            document.getElementById("usernameDisplay").textContent = currentUser;
            document.getElementById("userIcon").textContent = currentIcon;
        }

        function toggleSidebar() {
            const sidebar = document.getElementById("sidebar");
            sidebar.style.right = sidebar.style.right === "0px" ? "-450px" : "0px";
        }

        function chooseIcon(el) {
            currentIcon = el.textContent;
            localStorage.setItem("userIcon", currentIcon);
            updateUserDisplay();
        }

        function changeUsername() {
            const name = document.getElementById("newUsername").value.trim();
            if (name) {
                currentUser = name;
                localStorage.setItem("username", currentUser);
                updateUserDisplay();
            }
        }

        function toggleLike(btn) {
            const dislike = btn.parentElement.querySelectorAll('.reaction')[1];
            btn.textContent = "💖";
            dislike.textContent = "👎";
        }

        function toggleDislike(btn) {
            const like = btn.parentElement.querySelectorAll('.reaction')[0];
            btn.textContent = "💔";
            like.textContent = "❤️";
        }

        let currentGame = 1;

        function showCommentBox(gameId) {
            currentGame = gameId;
            document.getElementById('commentModal').style.display = "block";
            document.getElementById('commentHistory').innerHTML = "<p><em>Be the first to comment...</em></p>";
        }

        function closeCommentModal() {
            document.getElementById('commentModal').style.display = "none";
        }

        function postComment() {
            if (currentUser === "Guest") {
                alert("You must login or sign up to post comments!");
                return;
            }
            const input = document.getElementById('commentInput');
            if (input.value.trim() === "") return;

            const history = document.getElementById('commentHistory');
            const newP = document.createElement('p');
            newP.style.borderLeft = "4px solid #00ffff";
            newP.style.paddingLeft = "12px";
            newP.style.margin = "12px 0";
            newP.textContent = currentUser + ": " + input.value;
            history.appendChild(newP);
            input.value = "";
        }

        updateUserDisplay();
    </script>
</body>
</html>
