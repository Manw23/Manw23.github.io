<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMES | Manw23's Hub</title>
    <link rel="icon" href="http://example.com/favicon.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            font-family: 'Press Start 2P', cursive;
        }

        header {
            background: rgba(0, 0, 0, 0.95);
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 6px solid #ff00ff;
        }

        h1 { font-size: 3.5em; text-shadow: 0 0 20px #ff00ff; margin: 0; }

        .auth-buttons button {
            background: #ff00ff;
            color: white;
            border: none;
            padding: 12px 18px;
            margin-left: 10px;
            cursor: pointer;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            max-width: 1500px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .game-card {
            background: rgba(255,255,255,0.1);
            border: 4px solid #ff00ff;
            border-radius: 15px;
            overflow: hidden;
            transition: 0.4s;
        }

        .game-card:hover { transform: scale(1.08); box-shadow: 0 0 40px #00ffff; }

        .game-card img {
            width: 100%;
            height: 230px;
            object-fit: cover;
        }

        .game-info { padding: 15px; text-align: center; }

        .players { color: #00ff00; margin: 8px 0; }

        button {
            background: #ff00ff;
            color: white;
            border: none;
            padding: 10px 18px;
            margin: 4px;
            font-family: 'Press Start 2P', cursive;
            cursor: pointer;
        }

        button:hover { background: #00ffff; color: black; }

        .reaction { font-size: 1.5em; cursor: pointer; margin: 0 8px; }
    </style>
</head>
<body>
    <header>
        <h1>GAMES</h1>
        <div class="auth-buttons">
            <button onclick="showLogin()">LOGIN</button>
            <button onclick="showSignup()">SIGN UP</button>
        </div>
    </header>

    <div class="game-grid">

        <div class="game-card">
            <img src="https://upload.wikimedia.org/wikipedia/en/9/9a/Among_Us_cover_art.jpg" alt="Among Us">
            <div class="game-info">
                <h3>AMONG US</h3>
                <div class="players">4,291 playing now</div>
                <button onclick="window.open('https://www.innersloth.com/games/among-us/', '_blank')">PLAY NOW</button>
                <span class="reaction" onclick="like(this)">❤️</span>
                <span class="reaction" onclick="dislike(this)">👎</span>
                <button onclick="showRandomComments()">COMMENTS</button>
            </div>
        </div>

        <div class="game-card">
            <img src="https://upload.wikimedia.org/wikipedia/en/5/57/Minecraft_cover.png" alt="Minecraft">
            <div class="game-info">
                <h3>MINECRAFT</h3>
                <div class="players">21,874 playing now</div>
                <button onclick="window.open('https://www.minecraft.net/en-us', '_blank')">PLAY NOW</button>
                <span class="reaction" onclick="like(this)">❤️</span>
                <span class="reaction" onclick="dislike(this)">👎</span>
                <button onclick="showRandomComments()">COMMENTS</button>
            </div>
        </div>

        <div class="game-card">
            <img src="https://www.roblox.com/images/og-image.png" alt="Roblox">
            <div class="game-info">
                <h3>ROBLOX</h3>
                <div class="players">712,456 playing now</div>
                <button onclick="window.open('https://www.roblox.com', '_blank')">PLAY NOW</button>
                <span class="reaction" onclick="like(this)">❤️</span>
                <span class="reaction" onclick="dislike(this)">👎</span>
                <button onclick="showRandomComments()">COMMENTS</button>
            </div>
        </div>

        <div class="game-card">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/8d/Fortnite_Cover_Art.jpg/800px-Fortnite_Cover_Art.jpg" alt="Fortnite">
            <div class="game-info">
                <h3>FORTNITE</h3>
                <div class="players">134,872 playing now</div>
                <button onclick="window.open('https://www.fortnite.com', '_blank')">PLAY NOW</button>
                <span class="reaction" onclick="like(this)">❤️</span>
                <span class="reaction" onclick="dislike(this)">👎</span>
                <button onclick="showRandomComments()">COMMENTS</button>
            </div>
        </div>

        <!-- More Games -->
        <div class="game-card">
            <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/Logo_of_Slither.io-2024.png" alt="Slither.io">
            <div class="game-info">
                <h3>SLITHER.IO</h3>
                <div class="players">52,341 playing now</div>
                <button onclick="window.open('https://slither.io', '_blank')">PLAY NOW</button>
                <span class="reaction" onclick="like(this)">❤️</span>
                <span class="reaction" onclick="dislike(this)">👎</span>
                <button onclick="showRandomComments()">COMMENTS</button>
            </div>
        </div>

        <div class="game-card">
            <img src="https://krunker.io/img/krunker-logo.png" alt="Krunker.io">
            <div class="game-info">
                <h3>KRUNKER.IO</h3>
                <div class="players">31,289 playing now</div>
                <button onclick="window.open('https://krunker.io', '_blank')">PLAY NOW</button>
                <span class="reaction" onclick="like(this)">❤️</span>
                <span class="reaction" onclick="dislike(this)">👎</span>
                <button onclick="showRandomComments()">COMMENTS</button>
            </div>
        </div>

    </div>

    <!-- Login Modal -->
    <div id="loginModal" class="modal" style="display:none">
        <div class="modal-content">
            <span class="close" onclick="closeModals()">×</span>
            <h2>Login</h2>
            <input id="loginEmail" type="email" placeholder="Email" style="width:100%;padding:10px;margin:10px 0;"><br>
            <input id="loginPass" type="password" placeholder="Password" style="width:100%;padding:10px;margin:10px 0;"><br>
            <button onclick="login()">LOGIN</button>
        </div>
    </div>

    <!-- Sign Up Modal -->
    <div id="signupModal" class="modal" style="display:none">
        <div class="modal-content">
            <span class="close" onclick="closeModals()">×</span>
            <h2>Sign Up</h2>
            <input id="signupEmail" type="email" placeholder="Email" style="width:100%;padding:10px;margin:10px 0;"><br>
            <input id="signupPass" type="password" placeholder="Password" style="width:100%;padding:10px;margin:10px 0;"><br>
            <button onclick="signup()">SIGN UP</button>
        </div>
    </div>

    <!-- Comments Modal -->
    <div id="commentsModal" class="modal" style="display:none">
        <div class="modal-content">
            <span class="close" onclick="closeModals()">×</span>
            <h2>Live Comments</h2>
            <div id="commentsList"></div>
        </div>
    </div>

    <footer>
        <p>Made with ❤️ by Manw23 • 2026</p>
    </footer>

    <script>
        // Fake user memory
        let currentUser = localStorage.getItem("username") || null;

        function showLogin() {
            document.getElementById('loginModal').style.display = "block";
        }

        function showSignup() {
            document.getElementById('signupModal').style.display = "block";
        }

        function closeModals() {
            document.getElementById('loginModal').style.display = "none";
            document.getElementById('signupModal').style.display = "none";
            document.getElementById('commentsModal').style.display = "none";
        }

        function login() {
            const email = document.getElementById('loginEmail').value;
            if (email) {
                currentUser = email.split('@')[0];
                localStorage.setItem("username", currentUser);
                alert("✅ Logged in as " + currentUser);
                closeModals();
            } else {
                alert("Please enter email");
            }
        }

        function signup() {
            const email = document.getElementById('signupEmail').value;
            if (email) {
                currentUser = email.split('@')[0];
                localStorage.setItem("username", currentUser);
                alert("✅ Account created! Logged in as " + currentUser);
                closeModals();
            } else {
                alert("Please enter email");
            }
        }

        // Like / Dislike
        function like(btn) {
            btn.textContent = "💖";
            setTimeout(() => btn.textContent = "❤️", 800);
        }

        function dislike(btn) {
            btn.textContent = "💔";
            setTimeout(() => btn.textContent = "👎", 800);
        }

        // Realistic random comments
        const commentsPool = [
            "keeps crashing on my phone",
            "too many cheaters now",
            "this game used to be better",
            "anyone else getting lag?",
            "finally got a good match",
            "pay to win is ruining it",
            "boring after 2 weeks",
            "my team is terrible",
            "best when playing with friends",
            "why is everyone camping"
        ];

        function showRandomComments() {
            const modal = document.getElementById('commentsModal');
            const list = document.getElementById('commentsList');
            list.innerHTML = "";

            for (let i = 0; i < 6; i++) {
                const text = commentsPool[Math.floor(Math.random() * commentsPool.length)];
                const p = document.createElement('p');
                p.style.margin = "12px 0";
                p.style.paddingLeft = "12px";
                p.style.borderLeft = "4px solid #ff00ff";
                p.textContent = text;
                list.appendChild(p);
            }
            modal.style.display = "block";
        }
    </script>
</body>
</html>
