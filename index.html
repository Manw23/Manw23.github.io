<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMES | Manw23's Hub</title>
    <link rel="icon" href="http://example.com/favicon.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            text-align: center;
        }

        header {
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-bottom: 4px solid #ff00ff;
        }

        h1 {
            font-size: 3.5em;
            text-shadow: 0 0 10px #ff00ff, 0 0 20px #00ffff;
            margin: 10px;
        }

        .subtitle {
            font-size: 1.2em;
            color: #00ffff;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.1);
            border: 3px solid #ff00ff;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.4s;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.5);
        }

        .game-card:hover {
            transform: scale(1.08) rotate(2deg);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.8);
            border-color: #00ffff;
        }

        .game-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .game-info {
            padding: 15px;
        }

        .game-info h3 {
            margin: 10px 0;
            color: #00ffff;
        }

        button {
            background: #ff00ff;
            color: white;
            border: none;
            padding: 12px 25px;
            font-family: 'Press Start 2P', cursive;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        button:hover {
            background: #00ffff;
            color: #000;
            transform: translateY(-3px);
        }

        footer {
            margin-top: 60px;
            padding: 30px;
            background: rgba(0, 0, 0, 0.9);
            font-size: 0.9em;
        }

        .nav {
            margin: 20px 0;
        }

        .nav a {
            color: #00ffff;
            margin: 0 15px;
            text-decoration: none;
        }

        .nav a:hover {
            color: #ff00ff;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <h1>GAMES</h1>
        <p class="subtitle">Welcome to the place of games!</p>
        <p><strong>Manw23's Creation</strong></p>
    </header>

    <div class="nav">
        <a href="#">Home</a>
        <a href="#">Popular</a>
        <a href="#">New Releases</a>
        <a href="#">Community</a>

    <script>
        function playGame(gameName) {
            alert(`🚀 Launching ${gameName}... \n\n(Imagine the game starting here!)`);
            console.log(`${gameName} game launched!`);
        }

        // Keyboard Easter Egg
        document.addEventListener('keydown', (e) => {
            if (e.key === 'g' || e.key === 'G') {
                document.body.style.background = 'linear-gradient(135deg, #ff00ff, #00ffff)';
                setTimeout(() => {
                    document.body.style.background = 'linear-gradient(135deg, #0f0c29, #302b63, #24243e)';
                }, 800);
            }
        });
    </script>
