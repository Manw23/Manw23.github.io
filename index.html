<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMES | Manw23's Hub</title>
    <!-- Among Us Favicon -->
    <link rel="icon" href="https://www.innersloth.com/wp-content/uploads/2021/06/among-us-favicon.png" type="image/png">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            font-family: 'Press Start 2P', cursive;
        }

        header {
            background: rgba(0, 0, 0, 0.95);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 6px solid #ff00ff;
        }

        h1 { font-size: 3em; text-shadow: 0 0 20px #ff00ff; margin: 0; }

        .user-area {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .user-area:hover { color: #00ffff; }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            max-width: 1500px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .game-card {
            background: rgba(255,255,255,0.1);
            border: 4px solid #ff00ff;
            border-radius: 15px;
            overflow: hidden;
            transition: 0.4s;
        }

        .game-card:hover { transform: scale(1.08); box-shadow: 0 0 40px #00ffff; }

        .game-card img {
            width: 100%;
            height: 230px;
            object-fit: cover;
        }

        .game-info { padding: 15px; text-align: center; }

        .players { color: #00ff00; margin: 8px 0; }

        button {
            background: #ff00ff;
            color: white;
            border: none;
            padding: 10px 18px;
            margin: 4px;
            font-family: 'Press Start 2P', cursive;
            cursor: pointer;
        }

        button:hover { background: #00ffff; color: black; }

        .reaction { font-size: 1.6em; cursor: pointer; margin: 0 10px; }

        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            right: -400px;
            width: 380px;
            height: 100%;
            background: #1a0033;
            border-left: 6px solid #ff00ff;
            transition: 0.4s;
            padding: 20px;
            overflow-y: auto;
            z-index: 2000;
        }

        .sidebar.open { right: 0; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
        }

        .modal-content {
            background: #1a0033;
            margin: 8% auto;
            padding: 25px;
            width: 85%;
            max-width: 400px;
            border: 5px solid #ff00ff;
        }

        .close { color: #ff00ff; float: right; font-size: 32px; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <h1>GAMES</h1>
        <div class="user-area" onclick="toggleSidebar()">
            <span id="usernameDisplay">Guest</span>
        </div>
    </header>

    <!-- Sidebar -->
    <div id="sidebar" class="sidebar">
        <span class="close" onclick="toggleSidebar()">×</span>
        <h2>PROFILE</h2>
        <p><strong>Username:</strong> <span id="sidebarUsername">Guest</span></p>
        <input id="newUsername" placeholder="New Name" style="width:100%;padding:8px;margin:10px 0;">
        <button onclick="changeUsername()">CHANGE NAME</button>

        <h3>Choose Icon</h3>
        <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px;">
            <span onclick="chooseIcon(this)" style="font-size:40px;cursor:pointer;">🧑</span>
            <span onclick="chooseIcon(this)" style="font-size:40px;cursor:pointer;">👾</span>
            <span onclick="chooseIcon(this)" style="font-size:40px;cursor:pointer;">🚀</span>
            <span onclick="chooseIcon(this)" style="font-size:40px;cursor:pointer;">🎮</span>
            <span onclick="chooseIcon(this)" style="font-size:40px;cursor:pointer;">🐱</span>
            <span onclick="chooseIcon(this)" style="font-size:40px;cursor:pointer;">🔥</span>
            <span onclick="chooseIcon(this)" style="font-size:40px;cursor:pointer;">⚡</span>
            <span onclick="chooseIcon(this)" style="font-size:40px;cursor:pointer;">🦍</span>
            <span onclick="chooseIcon(this)" style="font-size:40px;cursor:pointer;">🕹️</span>
            <span onclick="chooseIcon(this)" style="font-size:40px;cursor:pointer;">🌌</span>
        </div>
        <button onclick="toggleSidebar()" style="margin-top:20px;width:100%;">CLOSE</button>
    </div>

    <div class="game-grid">
        <!-- Your games here (same as before) -->
        <div class="game-card">
            <img src="https://upload.wikimedia.org/wikipedia/en/9/9a/Among_Us_cover_art.jpg" alt="Among Us">
            <div class="game-info">
                <h3>AMONG US</h3>
                <div class="players">4,291 playing now</div>
                <button onclick="window.open('https://www.innersloth.com/games/among-us/', '_blank')">PLAY NOW</button>
                <span class="reaction" onclick="toggleLike(this)">❤️</span>
                <span class="reaction" onclick="toggleDislike(this)">👎</span>
                <button onclick="showRandomComments()">COMMENTS</button>
            </div>
        </div>

        <div class="game-card">
            <img src="https://upload.wikimedia.org/wikipedia/en/5/57/Minecraft_cover.png" alt="Minecraft">
            <div class="game-info">
                <h3>MINECRAFT</h3>
                <div class="players">21,874 playing now</div>
                <button onclick="window.open('https://www.minecraft.net/en-us', '_blank')">PLAY NOW</button>
                <span class="reaction" onclick="toggleLike(this)">❤️</span>
                <span class="reaction" onclick="toggleDislike(this)">👎</span>
                <button onclick="showRandomComments()">COMMENTS</button>
            </div>
        </div>

        <div class="game-card">
            <img src="https://www.roblox.com/images/og-image.png" alt="Roblox">
            <div class="game-info">
                <h3>ROBLOX</h3>
                <div class="players">712,456 playing now</div>
                <button onclick="window.open('https://www.roblox.com', '_blank')">PLAY NOW</button>
                <span class="reaction" onclick="toggleLike(this)">❤️</span>
                <span class="reaction" onclick="toggleDislike(this)">👎</span>
                <button onclick="showRandomComments()">COMMENTS</button>
            </div>
        </div>

        <div class="game-card">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/8d/Fortnite_Cover_Art.jpg/800px-Fortnite_Cover_Art.jpg" alt="Fortnite">
            <div class="game-info">
                <h3>FORTNITE</h3>
                <div class="players">134,872 playing now</div>
                <button onclick="window.open('https://www.fortnite.com', '_blank')">PLAY NOW</button>
                <span class="reaction" onclick="toggleLike(this)">❤️</span>
                <span class="reaction" onclick="toggleDislike(this)">👎</span>
                <button onclick="showRandomComments()">COMMENTS</button>
            </div>
        </div>

        <div class="game-card">
            <img src="https://upload.wikimedia.org/wikipedia/en/3/3f/Geometry_Dash_cover_art.png" alt="Geometry Dash">
            <div class="game-info">
                <h3>GEOMETRY DASH</h3>
                <div class="players">68,432 playing now</div>
                <button onclick="window.open('https://geometrydash.com', '_blank')">PLAY NOW</button>
                <span class="reaction" onclick="toggleLike(this)">❤️</span>
                <span class="reaction" onclick="toggleDislike(this)">👎</span>
                <button onclick="showRandomComments()">COMMENTS</button>
            </div>
        </div>

    </div>

    <!-- Login / Sign Up Modals -->
    <div id="loginModal" class="modal" style="display:none">
        <div class="modal-content">
            <span class="close" onclick="closeModals()">×</span>
            <h2>LOGIN</h2>
            <input id="loginEmail" type="email" placeholder="Email" style="width:100%;padding:10px;margin:10px 0;"><br>
            <input id="loginPass" type="password" placeholder="Password" style="width:100%;padding:10px;margin:10px 0;"><br>
            <button onclick="login()">LOGIN</button>
        </div>
    </div>

    <div id="signupModal" class="modal" style="display:none">
        <div class="modal-content">
            <span class="close" onclick="closeModals()">×</span>
            <h2>SIGN UP</h2>
            <input id="signupEmail" type="email" placeholder="Email" style="width:100%;padding:10px;margin:10px 0;"><br>
            <input id="signupPass" type="password" placeholder="Password" style="width:100%;padding:10px;margin:10px 0;"><br>
            <button onclick="signup()">CREATE ACCOUNT</button>
        </div>
    </div>

    <script>
        let currentUser = localStorage.getItem("username") || "Guest";

        function updateUserDisplay() {
            document.getElementById("usernameDisplay").textContent = currentUser;
            document.getElementById("sidebarUsername").textContent = currentUser;
        }

        function showLogin() { document.getElementById('loginModal').style.display = "block"; }
        function showSignup() { document.getElementById('signupModal').style.display = "block"; }
        function closeModals() {
            document.getElementById('loginModal').style.display = "none";
            document.getElementById('signupModal').style.display = "none";
        }

        function login() {
            const email = document.getElementById('loginEmail').value || "Player";
            currentUser = email.split('@')[0];
            localStorage.setItem("username", currentUser);
            updateUserDisplay();
            alert("✅ Logged in as " + currentUser);
            closeModals();
        }

        function signup() {
            const email = document.getElementById('signupEmail').value || "Player";
            currentUser = email.split('@')[0];
            localStorage.setItem("username", currentUser);
            updateUserDisplay();
            alert("✅ Account created! Welcome " + currentUser);
            closeModals();
        }

        function toggleSidebar() {
            document.getElementById("sidebar").classList.toggle("open");
        }

        function changeUsername() {
            const newName = document.getElementById("newUsername").value;
            if (newName) {
                currentUser = newName;
                localStorage.setItem("username", currentUser);
                updateUserDisplay();
            }
        }

        function chooseIcon(el) {
            alert("Icon changed! (Demo)");
        }

        // Like / Dislike
        function toggleLike(btn) {
            const card = btn.parentElement.parentElement;
            const dislikeBtn = card.querySelectorAll('.reaction')[1];
            btn.textContent = "💖";
            dislikeBtn.textContent = "👎";
        }

        function toggleDislike(btn) {
            const card = btn.parentElement.parentElement;
            const likeBtn = card.querySelectorAll('.reaction')[0];
            btn.textContent = "💔";
            likeBtn.textContent = "❤️";
        }

        // Random Comments
        const commentsPool = ["keeps crashing", "too many hackers", "used to be better", "super laggy", "finally won", "pay to win ruined it", "boring now", "my team sucks", "best with friends", "why is everyone camping"];

        function showRandomComments() {
            const modal = document.createElement("div");
            modal.style.position = "fixed";
            modal.style.top = "0";
            modal.style.left = "0";
            modal.style.width = "100%";
            modal.style.height = "100%";
            modal.style.background = "rgba(0,0,0,0.9)";
            modal.style.zIndex = "1000";
            modal.innerHTML = `
                <div style="background:#1a0033;margin:8% auto;padding:25px;width:80%;max-width:600px;border:5px solid #ff00ff;">
                    <span onclick="this.parentElement.parentElement.remove()" style="color:#ff00ff;float:right;font-size:32px;cursor:pointer;">×</span>
                    <h2>Live Comments</h2>
                    <div id="tempComments"></div>
                </div>`;
            document.body.appendChild(modal);

            const list = document.getElementById("tempComments") || modal.querySelector("#tempComments");
            for (let i = 0; i < 6; i++) {
                const text = commentsPool[Math.floor(Math.random() * commentsPool.length)];
                const p = document.createElement('p');
                p.style.margin = "12px 0";
                p.style.paddingLeft = "12px";
                p.style.borderLeft = "4px solid #ff00ff";
                p.textContent = text;
                list.appendChild(p);
            }
        }

        // Initialize
        updateUserDisplay();
    </script>
</body>
</html>
