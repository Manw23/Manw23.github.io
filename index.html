<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMES | Manw23's Hub</title>
    <link rel="icon" href="http://example.com/favicon.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            text-align: center;
        }

        header {
            background: rgba(0, 0, 0, 0.9);
            padding: 25px;
            border-bottom: 5px solid #ff00ff;
        }

        h1 {
            font-size: 3.8em;
            text-shadow: 0 0 15px #ff00ff, 0 0 25px #00ffff;
            margin: 10px;
        }

        .subtitle {
            font-size: 1.3em;
            color: #00ffff;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            max-width: 1300px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.08);
            border: 4px solid #ff00ff;
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.4s ease;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.6);
        }

        .game-card:hover {
            transform: scale(1.1);
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.9);
            border-color: #00ffff;
        }

        .game-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .game-info {
            padding: 20px;
        }

        .game-info h3 {
            margin: 12px 0;
            color: #00ffff;
            font-size: 1.4em;
        }

        button {
            background: #ff00ff;
            color: white;
            border: none;
            padding: 14px 30px;
            font-family: 'Press Start 2P', cursive;
            font-size: 1em;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        button:hover {
            background: #00ffff;
            color: black;
            transform: translateY(-4px);
        }

        footer {
            margin-top: 80px;
            padding: 40px;
            background: rgba(0, 0, 0, 0.95);
        }
    </style>
</head>
<body>
    <header>
        <h1>GAMES</h1>
        <p class="subtitle">Welcome to the place of games!</p>
        <p><strong>Manw23's Creation</strong></p>
    </header>

    <div class="game-grid">

        <div class="game-card">
            <img src="https://images.unsplash.com/photo-1611996575749-79a3ae1e0c97?w=600" alt="Among Us">
            <div class="game-info">
                <h3>AMONG US</h3>
                <button onclick="window.open('https://www.innersloth.com/games/among-us/', '_blank')">PLAY NOW</button>
            </div>
        </div>

        <div class="game-card">
            <img src="https://images.unsplash.com/photo-1587573089697-8c6c4c3e8c8f?w=600" alt="Minecraft">
            <div class="game-info">
                <h3>MINECRAFT</h3>
                <button onclick="window.open('https://www.minecraft.net/en-us', '_blank')">PLAY NOW</button>
            </div>
        </div>

        <div class="game-card">
            <img src="https://images.unsplash.com/photo-1616588587683-4d6f8f0b9c0c?w=600" alt="Roblox">
            <div class="game-info">
                <h3>ROBLOX</h3>
                <button onclick="window.open('https://www.roblox.com', '_blank')">PLAY NOW</button>
            </div>
        </div>

        <div class="game-card">
            <img src="https://images.unsplash.com/photo-1542751110-8d2c8e8e4f2d?w=600" alt="Fortnite">
            <div class="game-info">
                <h3>FORTNITE</h3>
                <button onclick="window.open('https://www.fortnite.com', '_blank')">PLAY NOW</button>
            </div>
        </div>

        <!-- Extra Games -->
        <div class="game-card">
            <img src="https://images.unsplash.com/photo-1607853202273-797f1c22a38e?w=600" alt="Valorant">
            <div class="game-info">
                <h3>VALORANT</h3>
                <button onclick="window.open('https://playvalorant.com', '_blank')">PLAY NOW</button>
            </div>
        </div>

        <div class="game-card">
            <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?w=600" alt="League of Legends">
            <div class="game-info">
                <h3>LEAGUE OF LEGENDS</h3>
                <button onclick="window.open('https://www.leagueoflegends.com', '_blank')">PLAY NOW</button>
            </div>
        </div>

        <div class="game-card">
            <img src="https://images.unsplash.com/photo-1616587226960-4a03badbe8bf?w=600" alt="GTA V">
            <div class="game-info">
                <h3>GTA V</h3>
                <button onclick="window.open('https://www.rockstargames.com/gta-v', '_blank')">PLAY NOW</button>
            </div>
        </div>

        <div class="game-card">
            <img src="https://images.unsplash.com/photo-1551105370-9c5f2c7a1b3a?w=600" alt="Terraria">
            <div class="game-info">
                <h3>TERRARIA</h3>
                <button onclick="window.open('https://terraria.org', '_blank')">PLAY NOW</button>
            </div>
        </div>

    </div>

    <footer>
        <p>Made with ❤️ by Manw23 • 2026</p>
        <p>More epic games coming soon...</p>
    </footer>
</body>
</html>
